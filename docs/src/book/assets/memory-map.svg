<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1050" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="1050" fill="#ffffff"/>

  <!-- Title -->
  <text x="950" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Carte mémoire de la Game Boy — 16-bit address bus</text>
  <text x="950" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">Termes repris tels quels du Pan Docs (Start/End/Description/Notes, puis détail des registres I/O)</text>

  <!-- Disclaimer -->
  <rect x="100" y="66" width="1700" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="950" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">⚠ Ce schéma couvre uniquement la Game Boy originale (DMG) — pas la Game Boy Color.</text>
  <text x="950" y="102" text-anchor="middle" font-size="11" font-style="italic" fill="#9a3412">Les entrées marquées « CGB » sont indiquées pour référence (Pan Docs) mais ne sont pas émulées par ce projet.</text>

  <!-- ================= MAIN MEMORY STRIP (12 rows, exact Pan Docs wording) ================= -->
  <g font-family="Consolas, Menlo, monospace" font-size="10" fill="#475569" text-anchor="end">
    <text x="92" y="134">0000</text>
    <text x="92" y="192">4000</text>
    <text x="92" y="250">8000</text>
    <text x="92" y="308">A000</text>
    <text x="92" y="366">C000</text>
    <text x="92" y="424">D000</text>
    <text x="92" y="482">E000</text>
    <text x="92" y="540">FE00</text>
    <text x="92" y="598">FEA0</text>
    <text x="92" y="656">FF00</text>
    <text x="92" y="714">FF80</text>
    <text x="92" y="772">FFFF</text>
  </g>

  <g>
    <rect x="100" y="130" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="188" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="246" width="240" height="58" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
    <rect x="100" y="304" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="362" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="420" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="478" width="240" height="58" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <rect x="100" y="536" width="240" height="58" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
    <rect x="100" y="594" width="240" height="58" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <rect x="100" y="652" width="240" height="58" fill="#1e293b" stroke="#0f172a" stroke-width="1.3"/>
    <rect x="100" y="710" width="240" height="58" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
    <rect x="100" y="768" width="240" height="58" fill="#fff7ed" stroke="#c2410c" stroke-width="1.3"/>
  </g>

  <g text-anchor="middle" font-weight="700" font-size="11.5">
    <text x="220" y="163" fill="#334155">ROM bank 00</text>
    <text x="220" y="221" fill="#334155">ROM Bank 01–NN</text>
    <text x="220" y="279" fill="#7c2d12">Video RAM (VRAM)</text>
    <text x="220" y="337" fill="#334155">External RAM</text>
    <text x="220" y="395" fill="#334155">Work RAM (WRAM)</text>
    <text x="220" y="453" fill="#334155">Work RAM (WRAM)</text>
    <text x="220" y="511" fill="#7f1d1d">Echo RAM</text>
    <text x="220" y="569" fill="#7c2d12">OAM</text>
    <text x="220" y="627" fill="#7f1d1d">Not Usable</text>
    <text x="220" y="685" fill="#f8fafc">I/O Registers</text>
    <text x="220" y="743" fill="#334155">High RAM (HRAM)</text>
    <text x="220" y="801" fill="#7c2d12">Interrupt Enable (IE)</text>
  </g>

  <!-- Start/End + Description + Notes, exact Pan Docs wording -->
  <g font-size="11.3" fill="#334155">
    <text x="360" y="148" font-weight="700" font-family="Consolas, Menlo, monospace">0000–3FFF · 16 KiB ROM bank 00</text>
    <text x="360" y="165" font-size="10.3" font-style="italic" fill="#64748b">From cartridge, usually a fixed bank</text>

    <text x="360" y="206" font-weight="700" font-family="Consolas, Menlo, monospace">4000–7FFF · 16 KiB ROM Bank 01–NN</text>
    <text x="360" y="223" font-size="10.3" font-style="italic" fill="#64748b">From cartridge, switchable bank via mapper (if any)</text>

    <text x="360" y="264" font-weight="700" fill="#7c2d12" font-family="Consolas, Menlo, monospace">8000–9FFF · 8 KiB Video RAM (VRAM)</text>
    <text x="360" y="281" font-size="10.3" font-style="italic" fill="#9a3412">In CGB mode, switchable bank 0/1</text>

    <text x="360" y="322" font-weight="700" font-family="Consolas, Menlo, monospace">A000–BFFF · 8 KiB External RAM</text>
    <text x="360" y="339" font-size="10.3" font-style="italic" fill="#64748b">From cartridge, switchable bank if any</text>

    <text x="360" y="380" font-weight="700" font-family="Consolas, Menlo, monospace">C000–CFFF · 4 KiB Work RAM (WRAM)</text>

    <text x="360" y="438" font-weight="700" font-family="Consolas, Menlo, monospace">D000–DFFF · 4 KiB Work RAM (WRAM)</text>
    <text x="360" y="455" font-size="10.3" font-style="italic" fill="#64748b">In CGB mode, switchable bank 1–7</text>

    <text x="360" y="496" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">E000–FDFF · Echo RAM (mirror of C000–DDFF)</text>
    <text x="360" y="513" font-size="10.3" font-style="italic" fill="#7f1d1d">Nintendo says use of this area is prohibited.</text>

    <text x="360" y="554" font-weight="700" fill="#7c2d12" font-family="Consolas, Menlo, monospace">FE00–FE9F · Object attribute memory (OAM)</text>

    <text x="360" y="612" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">FEA0–FEFF · Not Usable</text>
    <text x="360" y="629" font-size="10.3" font-style="italic" fill="#7f1d1d">Nintendo says use of this area is prohibited.</text>

    <text x="360" y="670" font-weight="700" fill="#1e293b" font-family="Consolas, Menlo, monospace">FF00–FF7F · I/O Registers</text>
    <text x="360" y="687" font-size="10.3" font-style="italic" fill="#1e293b">→ zoom à droite</text>

    <text x="360" y="728" font-weight="700" font-family="Consolas, Menlo, monospace">FF80–FFFE · High RAM (HRAM)</text>

    <text x="360" y="786" font-weight="700" fill="#7c2d12" font-family="Consolas, Menlo, monospace">FFFF–FFFF · Interrupt Enable register (IE)</text>
  </g>

  <!-- ================= FUNNEL: I/O Registers segment zooms into the detail strip on the right ================= -->
  <polygon points="340,652 340,710 950,826 950,140" fill="#1e293b" opacity="0.06" stroke="#1e293b" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- IE <-> Interrupts ($FF0F) cross reference (drawn first so detail boxes/text cover the overlap) -->
  <path d="M 340 826 L 340 850 L 1890 850 L 1890 283 L 1190 283" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>

  <!-- ================= VERTICAL I/O DETAIL STRIP (16 rows, exact Pan Docs order, same style as the main strip) ================= -->
  <text x="1070" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Détail — I/O Registers (0xFF00–0xFF7F)</text>

  <g font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#475569" text-anchor="end">
    <text x="942" y="144">$FF00</text>
    <text x="942" y="187.5">$FF01</text>
    <text x="942" y="231">$FF04</text>
    <text x="942" y="274.5">$FF0F</text>
    <text x="942" y="318">$FF10</text>
    <text x="942" y="361.5">$FF30</text>
    <text x="942" y="405">$FF40</text>
    <text x="942" y="448.5">$FF46</text>
    <text x="942" y="492">$FF4C</text>
    <text x="942" y="535.5">$FF4F</text>
    <text x="942" y="579">$FF50</text>
    <text x="942" y="622.5">$FF51</text>
    <text x="942" y="666">$FF56</text>
    <text x="942" y="709.5">$FF68</text>
    <text x="942" y="753">$FF6C</text>
    <text x="942" y="796.5">$FF70</text>
  </g>

  <g stroke-width="1.3">
    <rect x="950" y="140"   width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="183.5" width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="227"   width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="270.5" width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="314"   width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="357.5" width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="401"   width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="444.5" width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="488"   width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="531.5" width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="575"   width="240" height="43.5" fill="#1e293b" stroke="#0f172a"/>
    <rect x="950" y="618.5" width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="662"   width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="705.5" width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="749"   width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="950" y="792.5" width="240" height="43.5" fill="#fee2e2" stroke="#dc2626"/>
  </g>

  <g text-anchor="middle" font-size="11" font-weight="700">
    <text x="1070" y="166"   fill="#f8fafc">Joypad input</text>
    <text x="1070" y="209.5" fill="#f8fafc">Serial transfer</text>
    <text x="1070" y="253"   fill="#f8fafc">Timer and divider</text>
    <text x="1070" y="296.5" fill="#f8fafc">Interrupts</text>
    <text x="1070" y="340"   fill="#f8fafc">Audio</text>
    <text x="1070" y="383.5" fill="#f8fafc">Wave pattern</text>
    <text x="1070" y="427"   fill="#f8fafc">LCD Control, Status, Position…</text>
    <text x="1070" y="470.5" fill="#f8fafc">OAM DMA transfer</text>
    <text x="1070" y="514"   fill="#991b1b">KEY0 and KEY1</text>
    <text x="1070" y="557.5" fill="#991b1b">VRAM Bank Select</text>
    <text x="1070" y="601"   fill="#f8fafc">Boot ROM mapping control</text>
    <text x="1070" y="644.5" fill="#991b1b">VRAM DMA</text>
    <text x="1070" y="688"   fill="#991b1b">IR port</text>
    <text x="1070" y="731.5" fill="#991b1b">BG / OBJ Palettes</text>
    <text x="1070" y="775"   fill="#991b1b">Object priority mode</text>
    <text x="1070" y="818.5" fill="#991b1b">WRAM Bank Select</text>
  </g>

  <!-- Descriptions to the right of the detail strip (exact Pan Docs wording + address) -->
  <g font-size="11.3" fill="#334155">
    <text x="1210" y="166" font-weight="700" font-family="Consolas, Menlo, monospace">$FF00 · DMG · Joypad input</text>
    <text x="1210" y="209.5" font-weight="700" font-family="Consolas, Menlo, monospace">$FF01–$FF02 · DMG · Serial transfer</text>
    <text x="1210" y="253" font-weight="700" font-family="Consolas, Menlo, monospace">$FF04–$FF07 · DMG · Timer and divider</text>
    <text x="1210" y="296.5" font-weight="700" font-family="Consolas, Menlo, monospace">$FF0F · DMG · Interrupts</text>
    <text x="1210" y="340" font-weight="700" font-family="Consolas, Menlo, monospace">$FF10–$FF26 · DMG · Audio</text>
    <text x="1210" y="383.5" font-weight="700" font-family="Consolas, Menlo, monospace">$FF30–$FF3F · DMG · Wave pattern</text>
    <text x="1210" y="420" font-weight="700" font-family="Consolas, Menlo, monospace">$FF40–$FF4B · DMG · LCD Control, Status,</text>
    <text x="1210" y="434" font-size="10.3" font-family="Consolas, Menlo, monospace">Position, Scrolling, and Palettes</text>
    <text x="1210" y="470.5" font-weight="700" font-family="Consolas, Menlo, monospace">$FF46 · DMG · OAM DMA transfer</text>

    <text x="1210" y="507" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF4C–$FF4D · CGB · KEY0 and KEY1</text>
    <text x="1210" y="521" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="550.5" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF4F · CGB · VRAM Bank Select</text>
    <text x="1210" y="564.5" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="601" font-weight="700" font-family="Consolas, Menlo, monospace">$FF50 · DMG · Boot ROM mapping control</text>

    <text x="1210" y="637.5" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF51–$FF55 · CGB · VRAM DMA</text>
    <text x="1210" y="651.5" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="681" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF56 · CGB · IR port</text>
    <text x="1210" y="695" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="724.5" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF68–$FF6B · CGB · BG / OBJ Palettes</text>
    <text x="1210" y="738.5" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="768" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF6C · CGB · Object priority mode</text>
    <text x="1210" y="782" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>

    <text x="1210" y="811.5" font-weight="700" fill="#7f1d1d" font-family="Consolas, Menlo, monospace">$FF70 · CGB · WRAM Bank Select</text>
    <text x="1210" y="825.5" font-size="10.3" font-style="italic" fill="#dc2626">non utilisé par ce projet (DMG only)</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <rect x="100" y="900" width="22" height="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="130" y="911">mémoire générale (RAM/ROM)</text>

    <rect x="400" y="900" width="22" height="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="430" y="911">read/written by the PPU</text>

    <rect x="680" y="900" width="22" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="710" y="911">use prohibited / implementation-defined</text>

    <rect x="1080" y="900" width="22" height="14" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
    <text x="1110" y="911">I/O register — DMG (émulé)</text>

    <rect x="1380" y="900" width="22" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="1410" y="911">I/O register — CGB uniquement (non émulé)</text>
  </g>
</svg>
