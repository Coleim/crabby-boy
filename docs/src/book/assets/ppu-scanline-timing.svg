<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="650" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Le timing du PPU — une frame, dot par dot</text>
  <text x="650" y="52" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">1 frame = 154 scanlines × 456 dots = 70224 dots (~59.7 images/seconde)</text>

  <!-- ============== Top: one scanline exploded into its 3 visible modes ============== -->
  <text x="100" y="86" font-size="13" font-weight="700" fill="#334155">Une scanline visible (LY = 0–143), décomposée :</text>

  <rect x="100" y="96" width="140" height="60" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
  <text x="170" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">Mode 2</text>
  <text x="170" y="136" text-anchor="middle" font-size="10.5" fill="#854d0e">OAM Scan</text>
  <text x="170" y="150" text-anchor="middle" font-size="9.5" fill="#854d0e">80 dots (fixe)</text>

  <rect x="240" y="96" width="300" height="60" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="390" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">Mode 3</text>
  <text x="390" y="136" text-anchor="middle" font-size="10.5" fill="#9a3412">Drawing pixels</text>
  <text x="390" y="150" text-anchor="middle" font-size="9.5" fill="#9a3412">172–289 dots (variable)</text>

  <rect x="540" y="96" width="340" height="60" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="710" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Mode 0</text>
  <text x="710" y="136" text-anchor="middle" font-size="10.5" fill="#475569">Horizontal Blank</text>
  <text x="710" y="150" text-anchor="middle" font-size="9.5" fill="#475569">87–204 dots (variable)</text>

  <text x="890" y="130" font-size="11" fill="#64748b">← 456 dots au total, toujours —</text>
  <text x="890" y="146" font-size="11" fill="#64748b">   seule la répartition 3/0 varie</text>

  <text x="100" y="178" font-size="10.3" font-style="italic" fill="#64748b">Modes 2 et 3 : VRAM/OAM verrouillées pour le CPU (le PPU les utilise). Mode 0 : tout redevient accessible.</text>

  <!-- ============== Bottom: the whole frame, 154 stacked scanlines ============== -->
  <text x="100" y="214" font-size="13" font-weight="700" fill="#334155">La frame entière : 154 scanlines empilées</text>

  <!-- address-like LY ticks -->
  <g font-family="Consolas, Menlo, monospace" font-size="10" fill="#475569" text-anchor="end">
    <text x="92" y="238">LY=0</text>
    <text x="92" y="258">1</text>
    <text x="92" y="278">2</text>
    <text x="92" y="298">⋮</text>
    <text x="92" y="318">143</text>
    <text x="92" y="348">144</text>
    <text x="92" y="368">⋮</text>
    <text x="92" y="398">153</text>
  </g>

  <!-- rows 0..4 (visible, compact) -->
  <g stroke-width="1" stroke="#ffffff">
    <rect x="100" y="228" width="46.7" height="16" fill="#fef9c3"/>
    <rect x="146.7" y="228" width="175" height="16" fill="#ffedd5"/>
    <rect x="321.7" y="228" width="198.3" height="16" fill="#f1f5f9"/>

    <rect x="100" y="248" width="46.7" height="16" fill="#fef9c3"/>
    <rect x="146.7" y="248" width="175" height="16" fill="#ffedd5"/>
    <rect x="321.7" y="248" width="198.3" height="16" fill="#f1f5f9"/>

    <rect x="100" y="268" width="46.7" height="16" fill="#fef9c3"/>
    <rect x="146.7" y="268" width="175" height="16" fill="#ffedd5"/>
    <rect x="321.7" y="268" width="198.3" height="16" fill="#f1f5f9"/>

    <rect x="100" y="308" width="46.7" height="16" fill="#fef9c3"/>
    <rect x="146.7" y="308" width="175" height="16" fill="#ffedd5"/>
    <rect x="321.7" y="308" width="198.3" height="16" fill="#f1f5f9"/>
  </g>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#94a3b8">⋯ 140 scanlines identiques (mode 2 → 3 → 0) ⋯</text>

  <!-- 144 visible scanlines bracket -->
  <path d="M 70 228 L 60 228 L 60 324 L 70 324" fill="none" stroke="#334155" stroke-width="1.3"/>
  <text x="44" y="276" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" transform="rotate(-90 44 276)">144 visibles</text>

  <!-- VBlank block (10 lines, one band) -->
  <rect x="100" y="338" width="520" height="70" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.3"/>
  <text x="360" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">Mode 1 — Vertical Blank</text>
  <text x="360" y="386" text-anchor="middle" font-size="10.5" fill="#3730a3">10 scanlines (LY = 144–153) · 4560 dots · rien n'est dessiné, le CPU a accès à tout</text>

  <path d="M 70 338 L 60 338 L 60 408 L 70 408" fill="none" stroke="#334155" stroke-width="1.3"/>
  <text x="44" y="373" text-anchor="middle" font-size="10" font-weight="700" fill="#334155" transform="rotate(-90 44 373)">VBlank (10)</text>

  <text x="640" y="268" font-size="11" fill="#475569">1 scanline = 456 dots</text>
  <text x="640" y="368" font-size="11" fill="#3730a3">154 scanlines = 70224 dots / frame</text>

  <!-- Explanation block -->
  <rect x="100" y="440" width="1100" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="124" y="470" font-size="14" font-weight="700" fill="#0f172a">Ce que ça veut dire concrètement</text>
  <text x="124" y="498" font-size="12" fill="#334155">• La frame entière n'est <tspan font-weight="700">pas</tspan> dessinée d'un coup : le PPU dessine progressivement,</text>
  <text x="124" y="518" font-size="12" fill="#334155">  ligne par ligne, directement vers l'écran — jamais dans un buffer complet caché.</text>
  <text x="124" y="546" font-size="12" fill="#334155">• Les 144 premières scanlines (LY = 0 à 143) dessinent l'écran visible, de haut en</text>
  <text x="124" y="566" font-size="12" fill="#334155">  bas, et chaque ligne est produite de gauche à droite pendant le mode 3.</text>
  <text x="124" y="594" font-size="12" fill="#334155">• Les 10 scanlines suivantes (LY = 144 à 153) ne dessinent rien : c'est le VBlank,</text>
  <text x="124" y="614" font-size="12" fill="#334155">  la fenêtre de temps où le jeu peut modifier VRAM/OAM sans risquer un artefact</text>
  <text x="124" y="634" font-size="12" fill="#334155">  visuel, et où l'interruption VBlank (déjà câblée au chapitre 12) se déclenche.</text>
  <text x="124" y="662" font-size="12" fill="#334155">• 144 + 10 = 154 scanlines par frame. C'est le chiffre déjà utilisé par le PPU</text>
  <text x="124" y="682" font-size="12" fill="#334155">  minimal du chapitre 12 pour compter les lignes — ce schéma rend visible ce que</text>
  <text x="124" y="702" font-size="12" fill="#334155">  ce compteur représentait réellement.</text>
  <text x="124" y="730" font-size="12" fill="#334155">• La durée du mode 3 varie (172 à 289 dots) selon le nombre de sprites sur la</text>
  <text x="124" y="750" font-size="12" fill="#334155">  ligne et le défilement fin ; le mode 0 absorbe toujours la différence pour que</text>
  <text x="124" y="770" font-size="12" fill="#334155">  le total par scanline reste exactement 456 dots.</text>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <rect x="100" y="792" width="20" height="13" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.1"/>
    <text x="126" y="802">Mode 2 — OAM Scan</text>
    <rect x="310" y="792" width="20" height="13" fill="#ffedd5" stroke="#ea580c" stroke-width="1.1"/>
    <text x="336" y="802">Mode 3 — Drawing</text>
    <rect x="510" y="792" width="20" height="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1"/>
    <text x="536" y="802">Mode 0 — HBlank</text>
    <rect x="710" y="792" width="20" height="13" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.1"/>
    <text x="736" y="802">Mode 1 — VBlank</text>
  </g>
</svg>
